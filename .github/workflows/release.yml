# Builds one self-contained binary per platform and attaches them to the release,
# so the SessionStart hook can fetch one when Bun is not installed.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      # Until 0.8 there were no dependencies and bun test ran without node_modules;
      # nostr-tools arrived with 0.9 and the daemon died on import, so every test with a
      # daemon failed in CI. The frozen lockfile means what is tested is what is compiled.
      # The tag and plugin.json must say the same version: on 09-06 a tag was cut on the
      # wrong commit and, with tags immutable, there was no way to move it.
      - name: the tag matches plugin.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          v=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8")).version)')
          [ "$tag" = "$v" ] || { echo "tag v$tag but plugin.json says $v"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: compile
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build --compile --target=bun-$t src/cli.ts --outfile dist/spoochie-$t
          done
          (cd dist && sha256sum spoochie-* > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/spoochie-*
            dist/SHA256SUMS
          generate_release_notes: true
