# Tests on every push and pull request, on Linux and macOS. The release workflow only
# runs on tags; this is what catches a red suite before it becomes a release.
name: test
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      # Until 0.8 there were no dependencies and bun test ran without node_modules;
      # nostr-tools arrived with 0.9 and the daemon died on import, so every test with a
      # daemon failed in CI. The frozen lockfile means what is tested is what is compiled.
      - run: bun install --frozen-lockfile
      # The tests that start daemons wait on the clock. A CI runner is a shared, slow
      # machine: without slack, a timing budget failure reads as a logic failure. Measured
      # locally: the run that failed took 86 s where it normally takes 48.
      - run: bun test
        env: { SPOOCHIE_TEST_SLOW: "3" }
  # The previous version talking to HEAD, in both directions. spoochie ships as a binary
  # pinned to a plugin version, so two mismatched machines are the NORMAL case during the
  # weeks between a release and people updating. Until now protocol changes were checked
  # by eye.
  compatibilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      # The latest published tag, in a separate tree. `git archive` and not a worktree:
      # it does not touch the checkout and leaves nothing to clean up.
      - name: prepare the previous version
        run: |
          tag=$(git tag --list "v*" --sort=-v:refname | head -1)
          echo "ultima release: $tag"
          mkdir -p /tmp/sp-vieja
          git archive "$tag" | tar -x -C /tmp/sp-vieja
          cd /tmp/sp-vieja && bun install --frozen-lockfile
      - run: bun test tests/compat.test.ts
        env: { SPOOCHIE_OLD: /tmp/sp-vieja }

  # Nothing that identifies a person or company outside the project, no tokens, no real
  # Slack ids, no emails outside the list: in the tree, in the messages and in the author
  # emails of the new commits. The private word list is a secret.
  fugas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun scripts/leaks.ts --since "${{ github.event.pull_request.base.sha || github.event.before }}"
        env: { SPOOCHIE_FORBIDDEN_WORDS: "${{ secrets.FUGAS_PROHIBIDAS }}" }
