# Tests on every push and pull request, on Linux and macOS. The release workflow only
# runs on tags; this is what catches a red suite before it becomes a release.
name: test
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      # Hasta 0.8 no habia dependencias y bun test corria sin node_modules; nostr-tools
      # llego con 0.9 y el demonio moria al importar, asi que todos los tests con demonio
      # caian en CI. El lock fijo: lo que se prueba es lo que se compila.
      - run: bun install --frozen-lockfile
      # Los tests que levantan demonios esperan por reloj. Un runner de CI es una maquina
      # compartida y lenta: sin margen, un fallo de presupuesto se lee como un fallo de
      # logica. Medido en local: la pasada que fallo tardo 86 s donde normalmente tarda 48.
      - run: bun test
        env: { SPOOCHIE_TEST_LENTO: "3" }
  # Una version anterior hablando con HEAD, en las dos direcciones. spoochie se
  # distribuye como un binario fijado a una version de plugin, asi que dos maquinas
  # desparejadas es el caso NORMAL durante las semanas que van de una release a que la
  # gente actualice. Hasta ahora los cambios de protocolo se revisaban a ojo.
  compatibilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      # La ultima etiqueta publicada, en un arbol aparte. `git archive` y no un worktree:
      # no toca el checkout ni deja nada que limpiar.
      - name: preparar la version anterior
        run: |
          tag=$(git tag --list "v*" --sort=-v:refname | head -1)
          echo "ultima release: $tag"
          mkdir -p /tmp/sp-vieja
          git archive "$tag" | tar -x -C /tmp/sp-vieja
          cd /tmp/sp-vieja && bun install --frozen-lockfile
      - run: bun test tests/compat.test.ts
        env: { SPOOCHIE_VIEJA: /tmp/sp-vieja }

  # Nada que identifique a una persona o empresa ajena al proyecto, ni tokens, ni ids
  # reales de Slack, ni correos fuera de la lista: en el arbol, en los mensajes y en los
  # correos de autor de los commits nuevos. La lista privada de palabras es un secreto.
  fugas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun scripts/leaks.ts --desde "${{ github.event.pull_request.base.sha || github.event.before }}"
        env: { FUGAS_PROHIBIDAS: "${{ secrets.FUGAS_PROHIBIDAS }}" }
